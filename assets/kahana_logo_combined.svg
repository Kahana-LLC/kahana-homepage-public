<svg width="344.6" height="76.9" viewBox="0 0 344.6 76.9" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Linear gradient for the outer ring -->
    <linearGradient id="outerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ECC71"/>
      <stop offset="50%" stop-color="#23B06B"/>
      <stop offset="100%" stop-color="#1E88E5"/>
    </linearGradient>

    <!-- Subtle highlight gradient for segmented arcs -->
    <linearGradient id="segmentLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.00"/>
    </linearGradient>

    <!-- Inner circle clip -->
    <clipPath id="innerClip">
      <circle cx="38.45" cy="38.45" r="24.71"/>
    </clipPath>

    <!-- Mask for ring -->
    <mask id="ringMask">
      <rect x="0" y="0" width="76.9" height="76.9" fill="white"/>
      <circle cx="38.45" cy="38.45" r="24.71" fill="black"/>
    </mask>

    <!-- Warm sky gradient (top to horizon) -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDF3D9"/>   <!-- warm light -->
      <stop offset="55%" stop-color="#FBE8BA"/>
      <stop offset="85%" stop-color="#EAF4FF"/>  <!-- cooler near horizon -->
      <stop offset="100%" stop-color="#EAF4FF"/>
    </linearGradient>

    <!-- Sun glow -->
    <radialGradient id="sunGlow" cx="50%" cy="58%" r="35%">
      <stop offset="0%" stop-color="#FFF6D5" stop-opacity="1"/>
      <stop offset="60%" stop-color="#FFE7A1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFE7A1" stop-opacity="0"/>
    </radialGradient>

    <!-- Distant water tint near horizon -->
    <linearGradient id="horizonWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CFE9FF"/>
      <stop offset="100%" stop-color="#A7D4FA"/>
    </linearGradient>

    <!-- Text gradient for wordmark -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D47A1"/>
      <stop offset="50%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Logo Icon (left side) -->
  <g transform="translate(0, 0)">
    <!-- Outer ring -->
    <circle cx="38.45" cy="38.45" r="38.45" fill="url(#outerGrad)" mask="url(#ringMask)"/>

    <!-- Segmented overlays -->
    <g mask="url(#ringMask)">
      <path d="M 17 25
               A 36 36 0 0 1 60 17
               A 35 35 0 0 1 62 23
               A 40 40 0 0 0 15 31
               A 35 35 0 0 1 17 25 Z"
            fill="url(#segmentLight)"/>
      <path d="M 13 46
               A 38 38 0 0 0 63 42
               A 33 33 0 0 1 60 52
               A 38 38 0 0 1 19 56
               A 33 33 0 0 0 13 46 Z"
            fill="url(#segmentLight)" opacity="0.6"/>
      <path d="M 29 65
               A 36 36 0 0 0 69 44
               A 31 31 0 0 1 63 59
               A 36 36 0 0 1 38.45 69
               A 31 31 0 0 0 29 65 Z"
            fill="url(#segmentLight)" opacity="0.4"/>
    </g>

    <!-- Inner scene -->
    <g clip-path="url(#innerClip)">
      <!-- Sky -->
      <rect x="0" y="15" width="76.9" height="31" fill="url(#skyGrad)"/>
      <!-- Sun glow centered slightly above horizon -->
      <ellipse cx="38.45" cy="36" rx="27" ry="17" fill="url(#sunGlow)"/>

      <!-- Suggestion of a curved horizon -->
      <path d="M -4 38 C 13 36, 29 38, 38.45 38 C 48 38, 64 36, 81 38 L 81 40 L -4 40 Z"
            fill="url(#horizonWater)"/>

      <!-- Wave layers (lighter near horizon, darker foreground) -->
      <path d="M -6 40
               C 6 38, 17 42, 29 40
               C 40 38, 52 42, 63 40
               L 63 76.9 L -6 76.9 Z"
            fill="#8CC8F8"/>

      <path d="M -6 44
               C 6 42, 17 46, 29 44
               C 40 42, 52 46, 63 44
               L 63 76.9 L -6 76.9 Z"
            fill="#64B5F6"/>

      <path d="M -6 48
               C 6 46, 17 50, 29 48
               C 40 46, 52 50, 63 48
               L 63 76.9 L -6 76.9 Z"
            fill="#3E8EE6"/>

      <path d="M -6 52
               C 6 50, 17 54, 29 52
               C 40 50, 52 54, 63 52
               L 63 76.9 L -6 76.9 Z"
            fill="#1E6FCC"/>

      <!-- Subtle crest highlights -->
      <path d="M -5 45
               C 7 43, 18 47, 30 45
               C 41 43, 53 47, 64 45" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="0.6" fill="none"/>
      <path d="M -5 49
               C 7 47, 18 51, 30 49
               C 41 47, 53 51, 64 49" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="0.6" fill="none"/>
    </g>

    <!-- Inner circle edge (keeps clean boundary) -->
    <circle cx="38.45" cy="38.45" r="24.71" fill="none"/>
  </g>

  <!-- Wordmark (right side) -->
  <g transform="translate(100, 0)">
    <!-- kahana text -->
    <defs>
      <filter id="roundedCorners" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
        <feOffset dx="0" dy="0" result="offsetblur"/>
        <feFlood flood-color="white" flood-opacity="1"/>
        <feComposite in2="offsetblur" operator="in"/>
        <feMerge>
          <feMergeNode/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    <text x="0" y="55" font-family="Nunito, Arial, sans-serif" font-size="51" font-weight="bold" fill="#0d9488" style="font-variant-ligatures: normal; font-feature-settings: 'liga' 1, 'kern' 1;" filter="url(#roundedCorners)">
      kahana
    </text>
  </g>
</svg>
